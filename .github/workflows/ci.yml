name: CI

# On a PR: this file alone (its job names `test` and `pip-audit` are the checks
# branch protection requires). On a push to main: called by deploy.yml
# (`uses: ./.github/workflows/ci.yml`), once; a `push` trigger here would run the
# suite twice. A called workflow inherits the caller's github context, so the
# PostgreSQL image cache still lives under refs/heads/main, readable by PRs.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

# A newer push to a PR cancels the older run; a run for main never cancels
# another (that would fail the deploy of the older commit): one group per SHA.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Tests run on the production engine (PostgreSQL 16), not SQLite (OPERATIONS.md 3.22).
    env:
      STATE: DEV
      DB_ENGINE: postgresql
      DB_NAME: fleet
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # PostgreSQL n'est pas un `service` : un service se télécharge avant toute
      # étape, sans cache possible, et le registre refuse parfois (Docker Hub,
      # « Data limit exceeded » sur public.ecr.aws) — la CI échouait avant le
      # moindre test. L'image vit dans le cache d'Actions : un téléchargement par
      # mois au plus, trois tentatives, l'image du mois précédent en secours.
      - name: Clé du cache de l'image PostgreSQL (une par mois)
        id: cle-postgres
        run: echo "mois=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Image PostgreSQL depuis le cache
        id: cache-postgres
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/postgres-16.tar
          key: postgres-16-${{ steps.cle-postgres.outputs.mois }}
          restore-keys: postgres-16-

      - name: Image PostgreSQL depuis le registre (si le cache n'a pas celle du mois)
        id: telechargement-postgres
        if: steps.cache-postgres.outputs.cache-hit != 'true'
        run: |
          for essai in 1 2 3; do
            if docker pull public.ecr.aws/docker/library/postgres:16; then
              docker save public.ecr.aws/docker/library/postgres:16 -o /tmp/postgres-16.tar
              echo "neuve=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((essai * 20))
          done
          if [ -f /tmp/postgres-16.tar ]; then
            echo "::warning::Registre indisponible : image du cache d'un mois précédent."
          else
            echo "::error::Registre indisponible et aucune image en cache."
            exit 1
          fi

      - name: Mettre l'image du mois en cache
        if: steps.telechargement-postgres.outputs.neuve == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/postgres-16.tar
          key: postgres-16-${{ steps.cle-postgres.outputs.mois }}

      - name: Démarrer PostgreSQL 16
        run: |
          docker load -i /tmp/postgres-16.tar
          docker run -d --name postgres -p 5432:5432 \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=fleet \
            public.ecr.aws/docker/library/postgres:16
          for i in $(seq 1 30); do
            if docker exec postgres pg_isready -U postgres -h 127.0.0.1 >/dev/null 2>&1; then
              echo "PostgreSQL prêt."; exit 0
            fi
            sleep 2
          done
          docker logs postgres
          echo "::error::PostgreSQL ne répond pas."; exit 1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install
        # The lock first, so tests run on the exact versions production gets.
        run: |
          pip install --require-hashes -r requirements.txt
          pip install -r requirements-dev.txt
      # Same install as the deploy, in a clean venv: proves the lock is complete.
      - name: Lock is complete
        run: |
          python -m venv /tmp/lock-check
          /tmp/lock-check/bin/pip install --quiet --require-hashes --no-deps -r requirements.txt
          /tmp/lock-check/bin/pip check
      - name: Lint
        run: ruff check .
      - name: Migrations are in sync with the models
        run: python manage.py makemigrations --check --dry-run
      - name: Schema is committed
        run: >-
          python manage.py spectacular --file /tmp/schema.yaml --validate
          && diff -u --strip-trailing-cr openapi-schema.yaml /tmp/schema.yaml
      - name: Tests
        run: pytest -q

  # Known-vulnerability audit of the lock (OSV); tool version pinned.
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pip-audit (pinned)
        run: python -m pip install pip-audit==2.10.1
      - name: Audit the lock
        run: pip-audit --require-hashes --disable-pip -r requirements.txt
